# 把 loop 接到真实 transport 上（issue 012）：runner 是 IO 编排层，不进
# agent-core（红线 7 只约束 core/store，但这个 crate 本身就是「IO 归哪」这道题
# 的答案，见 src/lib.rs 顶部注释）。
#
# 独立成库不进 agent-cli：M3 的 server 会复用同一个 run_turn（issue 012 的
# 结构裁决），CLI 只是它现在唯一的宿主。
[package]
name = "agent-runtime"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
agent-core = { path = "../agent-core" }
agent-mcp = { path = "../agent-mcp" }
agent-providers = { path = "../agent-providers" }
agent-store = { path = "../agent-store" }
agent-tools = { path = "../agent-tools" }
agent-transport = { path = "../agent-transport" }
serde = { workspace = true }
serde_json = { workspace = true }

# 116：泵 async 化，115 拍板的 futures 最小子集（见根 Cargo.toml
# `[workspace.dependencies]` 的注释）。**这两个 crate 目前没有被这里的代码直接
# 用到**：115 原文建议的 `futures_util::executor::block_on` 实测不存在
# （`executor` 是独立的 `futures-executor` crate 才有的东西），`block_on` 因此
# 改成手写的（见 `src/block_on.rs`，115 原文预先批准的口子），零 futures 依赖。
# 保留这两个依赖是为了 117：`receive` 换成真正非阻塞的那一步要用
# `futures_util::channel::mpsc`，到时候不必再回来改一次 Cargo.toml。
futures-core = { workspace = true }
futures-util = { workspace = true }
