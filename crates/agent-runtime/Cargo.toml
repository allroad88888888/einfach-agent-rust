# 把 loop 接到真实 transport 上（issue 012）：runner 是 IO 编排层，不进
# agent-core（红线 7 只约束 core/store，但这个 crate 本身就是「IO 归哪」这道题
# 的答案，见 src/lib.rs 顶部注释）。
#
# 独立成库不进 agent-cli：M3 的 server 会复用同一个 run_turn（issue 012 的
# 结构裁决），CLI 只是它现在唯一的宿主。
[package]
name = "agent-runtime"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
agent-core = { path = "../agent-core" }
agent-mcp = { path = "../agent-mcp" }
agent-providers = { path = "../agent-providers" }
agent-store = { path = "../agent-store" }
agent-tools = { path = "../agent-tools" }
agent-transport = { path = "../agent-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
# 114b：`ProviderCall.deadline` / `PendingRemoteTool.deadline` 存的是绝对
# 时刻，`std::time::Instant`/`SystemTime` 在 wasm32-unknown-unknown 上
# `now()` 一调就 panic。不是 target-gated 依赖——`web-time` 自己按 target 内部
# 二选一（native 直接是 `std::time` 那个类型），两个目标都要能解析这一行。
web-time = { workspace = true }

# 116/117：泵 async 化 + IO 载体换成并发 future，115 拍板的 futures 最小子集
# （子集为什么正好是这两个 crate，见根 Cargo.toml `[workspace.dependencies]`）。
# 117 起它们**真的被用上了**：`src/io_bus.rs`（`mpsc::channel(0)` +
# `FuturesUnordered`）、`src/io_task.rs`（`SinkExt::send` 的会合背压）、
# `src/io_stream.rs`（工作线程侧同一条 channel 的阻塞发送）。
futures-channel = { workspace = true }
futures-util = { workspace = true }

# 114a：`persist::idb::web_kv` 是 `KvStore` 的真浏览器实现（`web_sys::IdbDatabase`
# 上薄薄一层），只在 wasm32 编译（该文件 `#[cfg(target_arch = "wasm32")]`）。放进
# `[target.'cfg(...)'.dependencies]` 而不是 `[dependencies]`：native 构建
# （`cargo test --workspace` 覆盖的那一侧）完全不需要解析/编译这几个 crate，
# 114a 的验收主证据（回放语义、红线 11）全部在 native 上用假的 `MemoryKv`
# 跑掉，见 `persist/idb/mod.rs` 模块文档。
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
] }
