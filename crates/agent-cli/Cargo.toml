# 最小 CLI 壳（issue 022，012 接到真实 loop 上）：读一行 → 组装 →
# agent-runtime 驱动 loop → 流式打印。
[package]
name = "agent-cli"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
agent-core = { path = "../agent-core" }
agent-mcp = { path = "../agent-mcp" }
agent-providers = { path = "../agent-providers" }
agent-runtime = { path = "../agent-runtime" }
agent-tools = { path = "../agent-tools" }
agent-transport = { path = "../agent-transport" }
serde_json = { workspace = true }

# Ctrl-C：见 src/main.rs 顶部注释——两条路里选的是真信号捕捉，不是「主线程读
# stdin + /cancel 命令」的纯 std 兜底方案。
ctrlc = "3"

# 116：`agent-runtime` 的泵 async 化之后，CLI 自己没有任何 async 运行时——需要
# 一个 `block_on` 才能把 `run_turn` 那条 await 链跑到底。**这个依赖目前没有被
# 这里的代码直接用到**：115 原文建议的 `futures_util::executor::block_on` 实测
# 不存在（见 `agent-runtime/Cargo.toml` 同款注释），CLI 实际调用的是
# `agent_runtime::block_on`（手写的最小实现）。保留它是为了满足 115 的决定
# 「futures 最小子集只到 futures-core/futures-util，且要进 agent-cli」这条字面
# 要求，也为将来 CLI 侧若要直接用 futures-util 的组合子留好位置；如果 117 之后
# 证实 CLI 永远不需要直接碰 futures-util，这一行可以删。
futures-util = { workspace = true }

[dev-dependencies]
# `model_switch` 的单测要拼一份 `RootConfig` 测试夹具——跟
# `agent-transport/src/config.rs` 自己的测试同一个手法（直接 `toml::from_str`），
# 不通过 `AGENT_PROVIDERS_CONFIG` 环境变量绕一圈：那条路径要修改进程级全局
# 状态，在同一个测试二进制内跟其它测试并发跑会互相打架。
toml = "0.8"
