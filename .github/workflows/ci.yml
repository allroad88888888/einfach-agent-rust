# 本地跑的四道门禁固化成推送/PR 的 CI —— 与 docs/WORKFLOW.md 的收工标准一字对应。
# 红线检查用的是同一个 scripts/check-invariants.sh，本地 hook 和 CI 口径一致。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (test + clippy + 红线)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 红线 12 的孪生：core 不依赖 adapter、不做模型判断，全靠这个脚本守。
      - name: 红线检查
        run: bash scripts/check-invariants.sh --all
      - name: clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test（默认 feature）
        run: cargo test --workspace
      # ts feature 打开 ts-rs，跑协议一致性测试——忘了重新生成 TS 就在这里红。
      - name: test（--features ts，协议一致性）
        run: cargo test -p agent-server --features ts

  ts:
    name: typescript (协议 + web typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck（protocol + web）
        run: pnpm -r typecheck
